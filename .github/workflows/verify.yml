name: Wallet Risk Checker — unit, build and live Chain MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test approval decoding, current allowance verification, scores and failure modes
        run: npm test
      - name: Build Cloudflare Worker
        run: npm run build
  live-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify actual Pharos Chain MCP wallet risk analysis
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pharos-wallet-risk-live-mcp
          path: proof/live-chain-proof.json
          retention-days: 30
          if-no-files-found: warn
